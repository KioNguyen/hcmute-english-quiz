<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ôn tập TOEFL Reading</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-index">
  <header class="topbar">
    <div class="wrap">
      <h1>Ôn tập Reading</h1>
      <p id="summary" class="muted">Đang tải…</p>
    </div>
  </header>
  <main class="wrap">
    <section class="howto">
      <strong>Cách dùng:</strong> chọn <em>Luyện tập</em> để biết đúng/sai ngay sau mỗi câu, hoặc <em>Kiểm tra</em> để làm hết rồi nộp.
      Trong bài, <strong>nhấp đôi</strong> (hoặc nhấn giữ trên điện thoại) vào bất kỳ từ nào để xem nghĩa tiếng Việt.
    </section>
    <div id="list" class="cards"></div>
    <p class="footer-actions"><button type="button" id="clear-btn" class="btn btn-ghost">Xoá toàn bộ tiến độ</button></p>
  </main>
  <script type="module" src="js/app-index.js"></script>
</body>
</html>
